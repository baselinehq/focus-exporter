name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe? Include the exact error output if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command you ran (redact credentials) and the flags used.
      placeholder: focus-exporter --provider planetscale --month 2026-07 --format json
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider
      description: Which provider adapter, if applicable.
      placeholder: planetscale
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirmation
      options:
        - label: I have not included any credentials or secrets in this report.
          required: true
